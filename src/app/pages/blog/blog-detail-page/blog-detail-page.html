<div *ngIf="!data" class="min-h-screen flex items-center justify-center bg-zinc-50 dark:bg-[#060608]">
  <div class="text-center space-y-4">
    <p class="text-zinc-500 dark:text-white/40">Blog not found</p>
    <button (click)="back()" class="text-[#0645fb] text-sm font-semibold hover:underline">Back to Resources</button>
  </div>
</div>

<div *ngIf="data" class="min-h-screen bg-zinc-50 dark:bg-[#060608] text-zinc-950 dark:text-zinc-100 transition-colors duration-300">

  <!-- ── HERO ── -->
  <section class="relative pt-8 pb-16 overflow-hidden border-b border-zinc-200 dark:border-white/5">
    <button (click)="back()" class="absolute bottom-4 left-4 md:left-8 z-20 inline-flex items-center gap-1.5 text-[10px] font-semibold text-zinc-500 dark:text-white/40 hover:text-[#0645fb] dark:hover:text-blue-400 transition-colors bg-white/80 dark:bg-[#111114]/80 backdrop-blur-xl border border-zinc-200 dark:border-white/10 rounded-xl px-3 py-1.5 shadow-sm">
      <lucide-icon [img]="ChevronLeft" class="w-3.5 h-3.5"></lucide-icon>
      Back to Resources
    </button>
    <div class="absolute inset-0 opacity-[0.06] dark:opacity-[0.04] pointer-events-none"
      style="background-image: radial-gradient(currentColor 1px, transparent 1px); background-size: 20px 20px;"></div>
    <div class="absolute top-0 left-1/4 w-[500px] h-[400px] bg-blue-600/5 dark:bg-blue-600/10 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-blue-500/30 to-transparent"></div>

    <div class="relative z-10 max-w-6xl mx-auto px-4 md:px-8">
      <div class="grid grid-cols-1 lg:grid-cols-[1fr_480px] gap-8 lg:gap-12 items-start">

        <div class="mt-24">
          <div class="flex items-center gap-3 mb-4 flex-wrap">
            <span class="text-[9px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20 font-mono">
              {{ data!.category }}
            </span>
            <span class="flex items-center gap-1 text-[10px] font-mono text-zinc-400 dark:text-white/30">
              <lucide-icon [img]="Calendar" class="w-3 h-3"></lucide-icon>
              {{ data!.date }}
            </span>
            <span class="flex items-center gap-1 text-[10px] font-mono text-zinc-400 dark:text-white/30">
              <lucide-icon [img]="Clock" class="w-3 h-3"></lucide-icon>
              {{ data!.readTime }}
            </span>
          </div>

          <h1 class="font-syne font-bold text-3xl md:text-4xl uppercase tracking-tight text-zinc-950 dark:text-white leading-[1.05] mb-6">
            {{ data!.title }}
          </h1>

          <div class="space-y-4 max-w-2xl">
            <p *ngFor="let p of data!.intro" class="text-sm md:text-base text-zinc-600 dark:text-zinc-400 leading-relaxed font-light">
              {{ p }}
            </p>
          </div>
        </div>

        <div class="relative mt-24">
          <div class="relative rounded-2xl overflow-hidden shadow-lg border border-zinc-200 dark:border-white/5">
            <img
              [src]="data!.bannerImage"
              [alt]="data!.title"
              class="w-full h-[280px] md:h-[340px] object-cover"
              loading="eager"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/30 via-transparent to-transparent"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── CONTENT ── -->
  <div class="max-w-6xl mx-auto px-4 md:px-8 mt-16 pb-12">
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_260px] gap-10 lg:gap-14">

      <article class="space-y-16">
        <section *ngFor="let section of data!.sections" [id]="section.id" class="scroll-mt-24 space-y-6">
          <h2 class="font-syne font-semibold text-2xl md:text-3xl uppercase tracking-tight text-zinc-950 dark:text-white">
            {{ section.heading }}
          </h2>

          <ng-container *ngFor="let p of section.paragraphs">
            <ul *ngIf="isArray(p); else plainParagraph" class="space-y-3">
              <li *ngFor="let item of asStringArray(p)" class="flex items-start gap-2.5 text-sm md:text-[15px] text-zinc-600 dark:text-zinc-400 leading-relaxed font-light">
                <span class="w-1.5 h-1.5 rounded-full bg-[#0645fb] shrink-0 mt-2"></span>
                {{ item }}
              </li>
            </ul>
            <ng-template #plainParagraph>
              <p class="text-sm md:text-[15px] text-zinc-600 dark:text-zinc-400 leading-relaxed font-light">
                {{ p }}
              </p>
            </ng-template>
          </ng-container>

          <div *ngIf="section.image" class="rounded-2xl overflow-hidden border border-zinc-200 dark:border-white/5 shadow-sm mt-8">
            <img
              [src]="section.image"
              [alt]="section.heading"
              class="w-full h-[260px] md:h-[360px] object-cover"
              loading="lazy"
            />
            <div class="px-5 py-3 bg-white dark:bg-[#111114] border-t border-zinc-100 dark:border-white/5">
              <p class="text-[10px] font-mono text-zinc-400 dark:text-white/30">
                Illustrative reference for {{ section.heading }}
              </p>
            </div>
          </div>
        </section>

        <!-- ── SUMMARY ── -->
        <section class="scroll-mt-24 space-y-4 border-t border-zinc-200 dark:border-white/5 pt-10">
          <h2 class="font-syne font-semibold text-2xl md:text-3xl uppercase tracking-tight text-zinc-950 dark:text-white">
            Summary
          </h2>
          <p class="text-sm md:text-[15px] text-zinc-600 dark:text-zinc-400 leading-relaxed font-light">
            {{ data!.summary }}
          </p>
        </section>

        <!-- ── PREV / NEXT NAV ── -->
        <div class="flex items-center justify-between gap-4 pt-6 border-t border-zinc-200 dark:border-white/5">
          <div>
            <button *ngIf="prevBlog" (click)="navigateBlog(prevBlog)"
              class="group flex items-center gap-3 text-left">
              <div class="w-10 h-10 rounded-xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 flex items-center justify-center group-hover:border-[#0645fb]/30 group-hover:text-[#0645fb] dark:group-hover:text-blue-400 transition-all shrink-0">
                <lucide-icon [img]="ArrowLeft" class="w-4 h-4"></lucide-icon>
              </div>
              <div class="hidden sm:block">
                <p class="text-[9px] font-mono text-zinc-400 dark:text-white/30 uppercase tracking-widest">Previous</p>
                <p class="text-xs font-semibold text-zinc-700 dark:text-white/70 group-hover:text-[#0645fb] dark:group-hover:text-blue-400 transition-colors line-clamp-1 max-w-[180px]">
                  {{ BLOG_DATA[prevBlog].title }}
                </p>
              </div>
            </button>
          </div>
          <div>
            <button *ngIf="nextBlog" (click)="navigateBlog(nextBlog)"
              class="group flex items-center gap-3 text-right">
              <div class="hidden sm:block">
                <p class="text-[9px] font-mono text-zinc-400 dark:text-white/30 uppercase tracking-widest">Next</p>
                <p class="text-xs font-semibold text-zinc-700 dark:text-white/70 group-hover:text-[#0645fb] dark:group-hover:text-blue-400 transition-colors line-clamp-1 max-w-[180px]">
                  {{ BLOG_DATA[nextBlog].title }}
                </p>
              </div>
              <div class="w-10 h-10 rounded-xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 flex items-center justify-center group-hover:border-[#0645fb]/30 group-hover:text-[#0645fb] dark:group-hover:text-blue-400 transition-all shrink-0">
                <lucide-icon [img]="ArrowRight" class="w-4 h-4"></lucide-icon>
              </div>
            </button>
          </div>
        </div>

        <!-- ── TRENDING BLOGS ── -->
        <section class="space-y-6 pt-4">
          <div class="flex items-center gap-3 border-b border-zinc-200 dark:border-white/5 pb-3">
            <span class="w-1.5 h-1.5 rounded-full bg-[#0645fb] animate-pulse"></span>
            <h2 class="font-syne font-semibold text-xs uppercase tracking-[0.2em] text-zinc-500 dark:text-white/40">
              Trending Now
            </h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <button
              *ngFor="let t of TRENDING"
              (click)="navigateBlog(t.id)"
              class="group text-left bg-white dark:bg-[#111114] border border-zinc-200 dark:border-white/5 rounded-2xl overflow-hidden hover:border-zinc-300 dark:hover:border-white/10 hover:-translate-y-0.5 transition-all duration-200"
            >
              <div class="h-28 overflow-hidden bg-zinc-100 dark:bg-white/5">
                <img
                  [src]="t.thumbnail"
                  [alt]="t.title"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                  loading="lazy"
                />
              </div>
              <div class="p-4">
                <span [class]="'text-[8px] font-semibold uppercase tracking-widest px-2 py-0.5 rounded-full font-mono inline-block mb-2 ' + (t.categoryColor === 'blue' ? 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20' : t.categoryColor === 'indigo' ? 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20' : 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20')">
                  {{ t.category }}
                </span>
                <h4 class="font-syne font-semibold text-xs uppercase tracking-tight text-zinc-900 dark:text-white leading-snug line-clamp-2 mb-2 group-hover:text-[#0645fb] dark:group-hover:text-blue-400 transition-colors">
                  {{ t.title }}
                </h4>
                <div class="flex items-center gap-2 text-[9px] font-mono text-zinc-400 dark:text-white/30">
                  <span>{{ t.date }}</span>
                  <span>·</span>
                  <span>{{ t.readTime }}</span>
                </div>
              </div>
            </button>
          </div>
        </section>
      </article>

      <!-- ── SIDEBAR ── -->
      <aside class="hidden lg:block">
        <div class="sticky top-24 space-y-6">
          <div class="bg-white dark:bg-[#111114] border border-zinc-200 dark:border-white/5 rounded-2xl p-5 space-y-3">
            <h3 class="text-[9px] font-bold uppercase tracking-widest text-zinc-400 dark:text-white/30 font-mono">
              Table of Contents
            </h3>
            <div class="space-y-1">
              <button
                *ngFor="let s of data!.sections"
                (click)="scrollToSection(s.id)"
                [class]="'block w-full text-left text-[11px] font-light leading-snug px-3 py-2 rounded-xl transition-all duration-200 ' + (activeSection === s.id ? 'bg-[#0645fb] text-white shadow-[0_2px_8px_rgba(6,69,251,0.25)]' : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-white')"
              >
                {{ s.heading }}
              </button>
            </div>
          </div>

          <div class="bg-white dark:bg-[#111114] border border-zinc-200 dark:border-white/5 rounded-2xl p-5 space-y-3">
            <h3 class="text-[9px] font-bold uppercase tracking-widest text-zinc-400 dark:text-white/30 font-mono">
              Share
            </h3>
            <div class="flex items-center gap-2">
              <a *ngFor="let s of SOCIAL_LINKS" [href]="s.href" target="_blank" rel="noopener noreferrer"
                class="w-9 h-9 rounded-full bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 flex items-center justify-center text-zinc-500 dark:text-white/40 hover:text-[#0645fb] dark:hover:text-blue-400 hover:border-blue-500/30 hover:bg-blue-50 dark:hover:bg-blue-500/10 transition-all">
                <lucide-icon [img]="s.icon" class="w-4 h-4"></lucide-icon>
              </a>
            </div>
          </div>

          <button (click)="back()"
            class="w-full text-[10px] font-bold uppercase tracking-widest font-syne px-4 py-3 rounded-xl border border-zinc-200 dark:border-white/10 text-zinc-600 dark:text-zinc-400 hover:border-[#0645fb]/30 hover:text-[#0645fb] dark:hover:text-blue-400 transition-all">
            Back to Resources
          </button>
        </div>
      </aside>
    </div>
  </div>
</div>
