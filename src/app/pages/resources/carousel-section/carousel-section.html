@if (resources.length) {
  <div class="space-y-5">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 rounded-lg flex items-center justify-center" [ngClass]="accentColor">
          <lucide-icon [img]="icon" class="w-3.5 h-3.5"></lucide-icon>
        </div>
        <h2 class="font-syne font-semibold text-lg uppercase tracking-tight text-zinc-950 dark:text-white">
          {{ title }}
        </h2>
        <span class="text-[10px] font-mono text-zinc-400 dark:text-white/30 bg-zinc-100 dark:bg-white/5 px-2 py-0.5 rounded-full">
          {{ resources.length }}
        </span>
      </div>

      <div class="flex items-center gap-1">
        <button
          (click)="scroll('left')"
          [disabled]="!canScrollLeft"
          class="w-8 h-8 rounded-xl bg-white dark:bg-[#111114] border border-zinc-200 dark:border-white/10 flex items-center justify-center transition-all disabled:opacity-30 hover:border-zinc-300 dark:hover:border-white/20 cursor-pointer"
          aria-label="Scroll left"
        >
          <lucide-icon [img]="ChevronLeft" class="w-3.5 h-3.5 text-zinc-600 dark:text-white/60"></lucide-icon>
        </button>
        <button
          (click)="scroll('right')"
          [disabled]="!canScrollRight"
          class="w-8 h-8 rounded-xl bg-white dark:bg-[#111114] border border-zinc-200 dark:border-white/10 flex items-center justify-center transition-all disabled:opacity-30 hover:border-zinc-300 dark:hover:border-white/20 cursor-pointer"
          aria-label="Scroll right"
        >
          <lucide-icon [img]="ChevronRight" class="w-3.5 h-3.5 text-zinc-600 dark:text-white/60"></lucide-icon>
        </button>
      </div>
    </div>

    <div
      #scrollEl
      class="flex gap-5 overflow-x-auto pb-2 scroll-smooth"
      style="scrollbar-width: none; -ms-overflow-style: none;"
    >
      @for (r of resources; track r.id) {
        <div class="min-w-[240px] md:min-w-[280px] lg:min-w-[300px] max-w-[320px] w-[40vw]">
          <app-resource-card
            [resource]="r"
            variant="default"
            (readBlog)="readBlog.emit($event)"
            (readWhitepaper)="readWhitepaper.emit($event)"
            (readCaseStudy)="readCaseStudy.emit($event)"
          ></app-resource-card>
        </div>
      }
    </div>
  </div>
}
