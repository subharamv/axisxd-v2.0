<div class="app-shell text-zinc-950 dark:text-[#F3F3F3] font-sans antialiased selection:bg-blue-600 selection:text-white">
  @if (navStyle() === 'glass') {
    <app-glass-navbar (switchStyle)="switchNavStyle('card')"></app-glass-navbar>
  } @else {
    <app-card-navbar (switchStyle)="switchNavStyle('glass')"></app-card-navbar>
  }

  <router-outlet></router-outlet>

  @if (!hideFooter()) {
    <app-footer></app-footer>
  }

  <app-contact-modal></app-contact-modal>
  <app-live-models-modal></app-live-models-modal>
  <app-cookie-consent></app-cookie-consent>
  <app-chat-widget></app-chat-widget>
</div>
